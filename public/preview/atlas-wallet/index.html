<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="data:," />
  <title>Atlas Wallet — UX-концепт в текущем кабинете</title>
  <style>
    :root {
      --ink: #250c01;
      --muted: #66554d;
      --orange: #ff961d;
      --orange-2: #ff6e2b;
      --gold: #fec84b;
      --green: #1f8f6a;
      --red: #d85146;
      --blue: #3f72d8;
      --surface: #fffdfa;
      --surface-soft: rgba(255, 255, 255, .82);
      --line: rgba(168, 110, 66, .21);
      --shadow: 0 18px 50px rgba(82, 48, 24, .14);
      --radius: 14px;
      --small-radius: 10px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Manrope, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #f4f0eb;
      overflow-x: hidden;
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid rgba(255, 150, 29, .34);
      outline-offset: 2px;
    }

    .prototype-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 18px;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid #ded7cf;
      backdrop-filter: blur(16px);
    }
    .prototype-title { min-width: 240px; }
    .prototype-title strong { display: block; font-size: 14px; }
    .prototype-title span { color: #776f68; font-size: 12px; }
    .screen-tabs {
      min-width: 0;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: thin;
    }
    .screen-tab {
      white-space: nowrap;
      border: 1px solid #ded7cf;
      background: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .screen-tab.active {
      color: #2b0e03;
      border-color: var(--orange);
      background: linear-gradient(90deg, var(--orange-2), var(--gold));
    }
    .screen-tab:disabled { opacity:.36;cursor:not-allowed;background:#f2efeb;color:#81776f; }
    .flow-return {
      flex: 0 0 auto;
      min-height: 36px;
      border: 1px solid var(--orange);
      border-radius: 999px;
      padding: 8px 13px;
      color: #351409;
      background: #fff7ed;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 16px rgba(255, 150, 29, .14);
    }
    .flow-return:hover { background: #ffead3; }
    .flow-return[hidden] { display: none; }
    .mode-switch {
      display:flex;gap:4px;padding:4px;border:1px solid #ded7cf;border-radius:12px;background:#f6f2ee;
      flex:0 0 auto;
    }
    .mode-switch button { border:0;background:transparent;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap; }
    .mode-switch button.active { color:#fff;background:#30231d;box-shadow:0 4px 12px rgba(48,35,29,.18); }

    .stage { padding: 18px; overflow: auto; }
    .app {
      width: min(1440px, 100%);
      min-height: 860px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 16% 32%, rgba(255,255,255,.68) 0 3.5%, transparent 3.8%),
        radial-gradient(circle at 74% 14%, rgba(255,255,255,.58) 0 7%, transparent 7.2%),
        linear-gradient(135deg, #fff5e8 0%, #ffe4cc 55%, #fff1df 100%);
      border: 1px solid rgba(154, 99, 54, .16);
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(83, 54, 33, .18);
    }
    .app::before,
    .app::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 28px solid rgba(255,255,255,.28);
      filter: blur(.2px);
      pointer-events: none;
    }
    .app::before { width: 260px; height: 160px; right: -50px; top: 46px; }
    .app::after { width: 180px; height: 110px; left: -70px; top: 116px; }

    .app.landing-mode { background:#fff; }
    .app.landing-mode::before,.app.landing-mode::after { display:none; }
    .landing-view { position:relative;z-index:2;min-height:860px;background:#fff; }
    .landing-header {
      height:78px;display:flex;align-items:center;gap:34px;padding:0 42px;border-bottom:1px solid #f1e8df;background:#fff;
    }
    .landing-header .logo { position:static;width:152px;flex:0 0 auto; }
    .landing-divider { width:1px;height:36px;background:#dfd8d1; }
    .landing-nav { display:flex;align-items:center;gap:30px;font-size:14px;font-weight:650;white-space:nowrap; }
    .landing-nav span { cursor:default; }
    .landing-actions { margin-left:auto;display:flex;align-items:center;gap:10px; }
    .landing-language,.landing-dashboard,.landing-signin {
      min-height:44px;border-radius:10px;padding:0 16px;font-weight:750;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
    }
    .landing-language { border:1px solid var(--orange-2);font-weight:650; }
    .landing-dashboard { border:0;background:linear-gradient(90deg,var(--orange),var(--gold)); }
    .landing-signin { border:1px solid var(--orange-2);color:var(--orange-2); }
    .landing-community {
      min-height:96px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:22px;padding:18px 42px;background:#fffaf3;border-bottom:1px solid #f5e7d8;
    }
    .community-faces { display:flex;padding-left:10px; }
    .community-faces span { width:44px;height:44px;margin-left:-10px;border:3px solid #fffaf3;border-radius:50%;display:grid;place-items:center;background:#f2ded0;color:#7b4b32;font-weight:850; }
    .landing-community small { display:block;color:var(--orange-2);font-weight:700;margin-bottom:4px; }
    .landing-community strong { display:block;font-size:16px; }
    .landing-community p { margin:3px 0 0;color:var(--muted);font-size:13px; }
    .community-cta { border:0;border-radius:10px;min-height:44px;padding:0 18px;color:#2b0e03;background:linear-gradient(90deg,var(--orange),var(--gold));font-weight:800;display:flex;align-items:center; }
    .landing-hero { min-height:686px;padding:42px 30px 0;text-align:center;overflow:hidden; }
    .landing-hero h1 { max-width:840px;margin:0 auto;font-size:48px;line-height:1.08;letter-spacing:-1.5px; }
    .landing-hero h2 { margin:18px 0 0;font-size:24px; }
    .landing-hero h2 span { color:var(--orange-2); }
    .landing-hero-actions { display:flex;justify-content:center;gap:14px;margin-top:26px; }
    .landing-hero-actions button,.landing-hero-actions span { min-height:46px;border-radius:10px;padding:0 20px;font-weight:800;display:flex;align-items:center;justify-content:center; }
    .landing-hero-actions .solid { border:0;background:linear-gradient(90deg,var(--orange),var(--gold)); }
    .landing-hero-actions .outline { border:1px solid var(--orange-2);background:#fff;color:var(--orange-2); }
    .landing-network { position:relative;width:min(940px,92%);height:260px;margin:38px auto 0;background:linear-gradient(rgba(240,179,125,.32) 1px,transparent 1px),linear-gradient(90deg,rgba(240,179,125,.32) 1px,transparent 1px);background-size:46px 34px;transform:perspective(560px) rotateX(58deg);transform-origin:50% 0;border-radius:8px; }
    .landing-network::before { content:"";position:absolute;width:150px;height:150px;left:50%;top:35px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 36% 28%,#ffd08c 0 12%,#ef8d43 38%,#c6531f 75%,#8e3518);box-shadow:0 18px 34px rgba(201,87,28,.28); }
    .landing-network span { position:absolute;width:36px;height:36px;border:4px solid #fff;border-radius:50%;background:#f0c3a2;box-shadow:0 4px 12px rgba(79,38,18,.16); }
    .landing-network span:nth-child(1){left:12%;top:40px}.landing-network span:nth-child(2){left:25%;top:112px}.landing-network span:nth-child(3){right:24%;top:90px}.landing-network span:nth-child(4){right:11%;top:145px}.landing-network span:nth-child(5){left:42%;top:178px}.landing-network span:nth-child(6){right:39%;top:26px}
    .landing-mode .modal-backdrop { inset:78px 0 0; }
    .auth-entry-grid { display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0; }
    .auth-entry {
      min-height:188px;padding:18px;border:1px solid rgba(170,111,67,.22);border-radius:12px;background:#fff;text-align:left;cursor:pointer;display:flex;flex-direction:column;
    }
    .auth-entry:hover { border-color:var(--orange);box-shadow:0 0 0 2px rgba(255,150,29,.10); }
    .auth-entry-icon { width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:#fff1df;color:var(--orange-2);font-size:21px;margin-bottom:14px; }
    .auth-entry strong { display:block;font-size:15px; }
    .auth-entry small { display:block;color:var(--muted);font-size:11px;line-height:1.45;margin:7px 0 14px; }
    .auth-entry b { margin-top:auto;color:var(--orange-2);font-size:12px; }

    .topbar {
      position: relative;
      z-index: 7;
      height: 72px;
      display: grid;
      grid-template-columns: 296px 1fr auto;
      align-items: center;
      padding: 0 26px 0 132px;
      background: rgba(255,255,255,.88);
      border-bottom: 1px solid rgba(158, 108, 71, .12);
      backdrop-filter: blur(20px);
    }
    .logo {
      width: 156px;
      position: absolute;
      left: 28px;
      top: 17px;
    }
    .top-left, .top-right { display: flex; align-items: center; gap: 12px; }
    .top-left { margin-left: 52px; }
    .top-right { justify-self: end; }
    .chip {
      height: 44px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 5px 13px;
      border: 1px solid rgba(194, 127, 77, .28);
      border-radius: 12px;
      background: rgba(255,255,255,.72);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.52);
    }
    .chip-icon {
      width: 30px; height: 30px; border-radius: 9px;
      display: grid; place-items: center;
      background: #fff1dd; color: var(--orange-2); font-size: 16px;
    }
    .chip-copy { line-height: 1.05; }
    .chip-copy small { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
    .chip-copy strong { font-size: 13px; }
    .wallet-chip { cursor: pointer; min-width: 162px; }
    .wallet-chip .chip-icon { background: #e5f4ed; color: var(--green); }
    .icon-chip { width: 44px; padding: 0; justify-content: center; font-size: 18px; }
    .mobile-nav { display:none; }

    .layout { display: grid; grid-template-columns: 296px 1fr; min-height: 788px; position: relative; z-index: 2; }
    .sidebar {
      position: relative;
      padding: 24px 16px 20px;
      background: rgba(255,255,255,.57);
      border-right: 1px solid rgba(156, 104, 62, .12);
      backdrop-filter: blur(10px);
    }
    .nav { display: grid; gap: 7px; }
    .nav-item {
      height: 46px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 0 16px;
      border-radius: 10px;
      color: #564840;
      font-size: 14px;
      font-weight: 600;
    }
    button.nav-item { width: 100%; border: 0; background: transparent; font-family: inherit; text-align: left; cursor: pointer; }
    button.nav-item:hover { background: rgba(255,153,0,.08); }
    .nav-item .ni { width: 22px; color: var(--orange); text-align: center; font-size: 18px; }
    .nav-item.active { color: white; background: linear-gradient(90deg, #f58c18, #f5aa42); }
    .nav-item.active .ni { color: white; }
    .health-title { margin-top: 30px; font-weight: 700; font-size: 13px; }
    .health-row { display: flex; align-items: center; gap: 10px; margin: 12px 4px 18px; }
    .health-line { width: 102px; height: 8px; border-radius: 10px; background: linear-gradient(90deg, var(--orange), var(--gold)); }
    .shield {
      margin-left: auto; width: 52px; height: 52px; border-radius: 14px;
      display: grid; place-items: center; color: var(--green); font-size: 30px;
      border: 1px solid var(--green); background: rgba(255,255,255,.7);
    }
    .system-card {
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(167,111,69,.15);
      border-radius: 12px;
      padding: 14px;
    }
    .period { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font-size:12px; }
    .flow-metric { display:grid; grid-template-columns:34px 1fr; gap:10px; align-items:center; }
    .flow-icon { width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:#d9f0e5;color:var(--green);font-weight:800; }
    .fake-value { height: 16px; border-radius: 5px; background: linear-gradient(90deg,var(--orange),var(--gold)); width: 84px; margin-top: 8px; }

    .main { position: relative; padding: 48px 56px 80px; min-width: 0; }
    .page-head h1 { margin: 0; font-size: 34px; line-height: 1.15; }
    .page-head p { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
    .center-form { width: 520px; margin: 44px auto 0; }
    .field-label { display: block; margin: 0 0 9px; color: #594b43; font-size: 13px; font-weight: 600; }
    .segment {
      display: grid; grid-template-columns: 1fr 1fr; padding: 4px;
      background: rgba(255,255,255,.86); border-radius: 12px; margin-bottom: 26px;
      border: 1px solid rgba(171,111,65,.13);
    }
    .segment button { border:0; border-radius:9px; background:transparent; padding:12px; font-weight:700; cursor:pointer; }
    .segment button span { display:block; font-size:11px; font-weight:500; margin-top:3px; }
    .segment .selected { color:#2b0e03; background:linear-gradient(90deg,#f58c18,#f6aa43); }
    .select, .input, .result {
      width: 100%; min-height: 50px; display:flex; align-items:center; justify-content:space-between;
      padding: 0 15px; background: rgba(255,255,255,.9); border:1px solid rgba(161,112,76,.18);
      border-radius: 10px; margin-bottom: 24px; font-size: 14px;
    }
    .input { justify-content:flex-start; color:#574942; }
    .result { color:white; font-weight:700; background:linear-gradient(90deg,#3f8f6f,#2b996f); }
    .source-row {
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      margin: -8px 0 16px; padding: 12px 14px;
      border:1px solid rgba(31,143,106,.25); border-radius:10px; background:rgba(255,255,255,.74);
      font-size:12px;
    }
    .source-left { display:flex;align-items:center;gap:9px;font-weight:700; }
    .source-icon { width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:#e3f3eb;color:var(--green); }
    .source-right { text-align:right; }
    .source-right a { display:block;color:var(--orange-2);margin-top:3px;cursor:pointer; }
    .checks { display:grid;gap:10px;margin: 18px 0; font-size:12px; color:#4e423c; }
    .check { width:100%;min-height:44px;display:flex;gap:9px;align-items:center;text-align:left;border:0;background:transparent;padding:7px 0;cursor:pointer; }
    .box { width:18px;height:18px;border-radius:4px;background:white;border:1px solid #d8cabb;flex:0 0 auto; }
    .box.checked { display:grid;place-items:center;background:var(--green);border-color:var(--green);color:white;font-size:12px;font-weight:900; }
    .primary {
      width:100%; border:0; border-radius:10px; min-height:50px; color:#2b0e03; font-weight:800;
      background:linear-gradient(90deg,var(--orange-2),var(--gold)); cursor:pointer;
    }
    .primary:disabled { opacity:.45; cursor:not-allowed; }
    .secondary {
      border:1px solid rgba(171,111,65,.28); border-radius:10px; min-height:44px;
      padding:0 16px;background:white;font-weight:700;cursor:pointer;
    }
    .text-btn { border:0;background:transparent;color:#5a4a43;font-weight:700;cursor:pointer; }
    .hint { margin:12px 0 0;text-align:center;color:#60534c;font-size:11px; }

    .dashboard-grid { display:grid; grid-template-columns:repeat(4,1fr);gap:12px;margin-top:36px; }
    .metric-card { min-height:118px;background:rgba(255,255,255,.72);border:1px solid rgba(166,111,69,.13);border-radius:13px;padding:18px; }
    .metric-card strong { display:block;font-size:13px;line-height:1.3; }
    .metric-card small { color:var(--orange);display:block;margin:12px 0 8px; }
    .metric-card b { font-size:18px; }
    .dashboard-panel { margin-top:30px;display:grid;grid-template-columns:1.4fr 1fr;gap:28px; }
    .large-card { min-height:250px;border-radius:14px;background:rgba(255,255,255,.68);border:1px solid rgba(165,110,68,.12);padding:20px; }
    .wallet-banner { margin-top:24px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:15px 17px;border:1px solid rgba(255,150,29,.28);border-radius:12px;background:rgba(255,250,242,.9); }
    .wallet-banner strong { display:block;font-size:14px; }.wallet-banner small { display:block;color:var(--muted);margin-top:4px;line-height:1.4; }

    .drawer-backdrop, .modal-backdrop {
      position:absolute;inset:72px 0 0;z-index:20;background:rgba(48,31,21,.28);backdrop-filter:blur(2px);
    }
    .drawer {
      position:absolute;z-index:21;top:88px;right:18px;width:410px;max-height:744px;overflow:auto;
      background:#fffdfa;border:1px solid rgba(174,112,68,.22);border-radius:16px;box-shadow:var(--shadow);padding:22px;
    }
    .drawer-head, .modal-head { display:flex;align-items:center;justify-content:space-between;gap:12px; }
    .drawer h2, .modal h2 { margin:0;font-size:22px; }
    .close { border:0;background:transparent;font-size:24px;color:#8b7c72;cursor:pointer; }
    .balance {
      margin:18px 0;padding:20px;border-radius:13px;color:#fff;
      background:linear-gradient(125deg,#ef7b21,#ffb338 70%,#ffd66a);
    }
    .balance small { opacity:.85; }
    .balance strong { display:block;font-size:34px;margin:8px 0 12px; }
    .address { display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:9px;background:rgba(255,255,255,.18);font-size:12px; }
    .quick-actions { display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 22px; }
    .action {
      border:1px solid rgba(171,111,65,.19);background:white;border-radius:11px;padding:13px 8px;text-align:center;cursor:pointer;font-size:12px;font-weight:700;
    }
    .action i { display:grid;place-items:center;width:32px;height:32px;margin:0 auto 8px;border-radius:9px;background:#fff1df;color:var(--orange-2);font-style:normal;font-size:18px; }
    .section-title { display:flex;align-items:center;justify-content:space-between;margin:19px 0 10px;font-size:13px;font-weight:800; }
    .section-title a { color:var(--orange-2);font-size:11px;cursor:pointer; }
    .tx-list { display:grid;gap:8px; }
    .tx { display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:10px;background:#fff8ef;border:1px solid rgba(167,111,69,.12); }
    .tx-icon { width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:#e6f5ee;color:var(--green);font-weight:900; }
    .tx small { display:block;color:var(--muted);margin-top:3px;font-size:10px; }
    .tx strong { font-size:12px; }
    .tx-amount { text-align:right; }
    .tx-amount.in { color:var(--green); }.tx-amount.out { color:var(--ink); }
    .tx-button { width:100%;text-align:left;color:inherit;cursor:pointer; }

    .modal-backdrop { display:grid;place-items:center; }
    .modal {
      width:440px;max-height:700px;overflow:auto;background:#fffdfa;border:1px solid rgba(174,112,68,.22);
      border-radius:16px;box-shadow:var(--shadow);padding:24px;
    }
    .modal.wide { width:650px; }
    .modal-copy { color:var(--muted);font-size:13px;line-height:1.5;margin:8px 0 18px; }
    .steps { display:flex;align-items:center;gap:7px;margin:18px 0 24px; }
    .step-dot { width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#f2e7dc;color:#8b786c;font-size:11px;font-weight:800; }
    .step-dot.active { color:white;background:var(--orange); }.step-dot.done { color:white;background:var(--green); }
    .step-line { height:2px;flex:1;background:#eaded2; }.step-line.done { background:var(--green); }
    .choice-grid { display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 20px; }
    .choice {
      padding:14px;border:1px solid rgba(170,111,67,.2);border-radius:11px;background:white;cursor:pointer;
    }
    .choice.selected { border-color:var(--orange);box-shadow:0 0 0 2px rgba(255,150,29,.12); }
    .choice strong { display:block;font-size:13px; }.choice small { display:block;color:var(--muted);margin-top:5px;line-height:1.35; }
    .asset-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 18px; }
    .asset-choice { width:100%;min-height:88px;padding:12px;border:1px solid rgba(170,111,67,.2);border-radius:10px;background:#fff;cursor:pointer;text-align:left;position:relative; }
    .asset-choice.selected { border-color:var(--orange);box-shadow:0 0 0 2px rgba(255,150,29,.12);background:#fffaf2; }
    .asset-symbol { width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:#fff1df;color:var(--orange-2);font-weight:900;margin-bottom:8px; }
    .asset-choice strong { display:block;font-size:12px; }.asset-choice small { color:var(--muted);font-size:9px;line-height:1.35;display:block;margin-top:3px; }

<body>
  <div class="prototype-bar">
    <div class="prototype-title">
      <strong>Atlas Wallet — полный UX-прототип</strong>
      <span>Только расширение текущего кабинета, не редизайн</span>
    </div>
    <div class="mode-switch" aria-label="Сценарий входа">
      <button id="emailMode" class="active" onclick="setUserMode('email')">Вход по e-mail</button>
      <button id="web3Mode" onclick="setUserMode('web3')">Вход через Web3</button>
    </div>
    <button id="flowReturn" class="flow-return" type="button" onclick="returnToFlow()" hidden>← Вернуться к схеме</button>
    <div class="screen-tabs" id="screenTabs"></div>
  </div>

  <div class="stage">
    <div class="app" id="app"></div>
    <div class="prototype-note">
      <span id="prototypeNote">E-mail-сценарий: Atlas Wallet — входной мост, а не второй кабинет.</span>
      <span>Данные демонстрационные • операции не выполняются • LIVE-сайт не изменён</span>
    </div>
  </div>

  <script>
    const screens = [
      ['flows', 'Блок-схемы'],
      ['landing', 'Главная: кнопки'],
      ['landingAuth', 'Главная: единый вход'],
      ['auth', 'Авторизация'],
      ['emailAuth', 'Вход по e-mail'],
      ['wallet', 'Кошелёк'],
      ['setup', 'E-mail: создать Wallet'],
      ['deposit', 'Пополнить'],
      ['depositCrypto', 'Криптовалюта'],
      ['depositProvider', 'Котировка провайдера'],
      ['depositCard', 'Банковская карта'],
      ['depositCardWait', 'Карта: обработка'],
      ['depositWait', 'Ожидание'],
      ['send', 'Отправить'],
      ['withdraw', 'Вывести BEP-20'],
      ['swap', 'Swap · отдельно'],
      ['migrate', 'Внешний Web3-кошелёк'],
      ['cycle', 'Smart Cycle'],
      ['cycleConfirm', 'Подтверждение'],
      ['claim', 'Claim'],
      ['claimConfirm', 'Claim: подтверждение'],
      ['pending', 'Операция в сети'],
      ['success', 'Результат'],
      ['history', 'История'],
      ['historyDetail', 'Детали операции'],
      ['security', 'Безопасность'],
      ['states', 'Все состояния']
    ];

    const emailOnlyScreens = new Set(['emailAuth','emailRecovery','wallet','setup','walletCreated','deposit','depositCrypto','depositProvider','depositProviderWait','depositCard','depositCardWait','depositWait','send','sendReview','withdraw','withdrawReview','swap','migrate','migrationTransfer','migrationFinal','states']);
    let current = 'flows';
    let userMode = 'email';
    let walletReady = false;
    let emailAuthMode = 'login';
    let authEntryReturn = 'auth';
    let referralAccepted = false;
    let selectedAsset = 'usdt-bep20';
    let historyFilter = 'all';
    let operationKind = 'send';
    let flowKind = 'lockup';
    let activeFlowKey = 'entry';
    let flowPreviewActive = false;
    let cycleConsents = [false, false, false];
    let migrationConnected = false;
    let migrationBalanceTransferred = false;
    let migrationCyclesClosed = false;
    let hasArchivedWalletHistory = false;
    let mobileMenuOpen = false;
    let sendAmount = 100;
    let withdrawAmount = 250;
    let cycleAmount = 100;
    let selectedHistoryIndex = 0;
    let walletReturnTo = 'dashboard';
    const atlasWalletAddress = '0x71A40000000000000000000000000000000092F8';
    const web3OriginAddress = '0xC71D00000000000000000000000000000000bBE1';
    const externalWeb3Address = '0x9B720000000000000000000000000000000073D2';
    const usdtBep20Contract = '0x55d398326f99059fF775485246999027B3197955';
    const demoTxHash = '0x8f6d000000000000000000000000000000000000000000000000000000006489';
    const tabs = document.getElementById('screenTabs');
    screens.forEach(([id,label]) => {
      const b = document.createElement('button');
      b.className = 'screen-tab';
      b.textContent = label;
      b.dataset.screen = id;
      b.onclick = () => {
        flowPreviewActive = false;
        openPrototypeScreen(id);
      };
      tabs.appendChild(b);
    });

    function openPrototypeScreen(id, operation=''){
      if(id==='emailAuth') authEntryReturn='auth';
      const emailPreview=emailOnlyScreens.has(id) || ['history','historyDetail'].includes(id);
      if(emailPreview){
        userMode='email';
        if(id==='setup') walletReady=false;
        else if(!['emailAuth','emailRecovery'].includes(id)) walletReady=true;
      }
      if(operation) operationKind=operation;
      else if(id==='claimConfirm') operationKind='claim';
      else if(id==='pending' || id==='success') operationKind='send';
      render(id);
    }

    function selectFlow(key){
      activeFlowKey=key;
      flowPreviewActive=false;
      render('flows');
    }
    function openFlowStep(screen,operation=''){
      flowPreviewActive=true;
      if(screen==='web3' || screen==='web3Migrated'){
        userMode='web3';
        walletReady=false;
        render(screen);
        return;
      }
      openPrototypeScreen(screen,operation);
    }

    function returnToFlow(){
      flowPreviewActive=false;
      render('flows');
    }

    function syncPrototypeControls(){
      document.getElementById('emailMode').classList.toggle('active', userMode==='email');
      document.getElementById('web3Mode').classList.toggle('active', userMode==='web3');
      document.getElementById('flowReturn').hidden = !flowPreviewActive || current==='flows';
      document.querySelectorAll('.screen-tab').forEach(b => {
        b.disabled = false;
        b.title = '';
      });
      document.getElementById('prototypeNote').textContent = userMode==='email'
        ? 'E-mail-сценарий: Atlas Wallet — входной мост; позже аккаунт можно перевести в Web3 без потери структуры.'
        : 'Web3-сценарий: Atlas Wallet не создаётся и не показывается. Работает только подключённый внешний кошелёк.';
    }

    function setUserMode(mode){
      flowPreviewActive=false;
      userMode = mode;
      walletReady = mode==='web3' ? false : walletReady;
      if(mode==='email') emailAuthMode='login';
      if(mode==='web3') hasArchivedWalletHistory=false;
      mobileMenuOpen=false;
      syncPrototypeControls();
      render(mode==='email' ? 'emailAuth' : 'web3');
    }

    function revealActiveFlow(){
      requestAnimationFrame(() => {
        const nav=document.querySelector('.flow-scenario-tabs');
        const active=nav?.querySelector('.flow-scenario-tab.active');
        if(!nav || !active || nav.scrollWidth<=nav.clientWidth) return;
        nav.scrollLeft=Math.max(0,active.offsetLeft-(nav.clientWidth-active.offsetWidth)/2);
      });
    }

    function toggleMobileMenu(){ mobileMenuOpen=!mobileMenuOpen; render(current); }
    function goTo(route){ mobileMenuOpen=false; render(route); }

    const icons = {
      dash:'▦', provide:'⟳', cycles:'◧', partners:'♟', vote:'▣', profile:'●', knowledge:'▤'
    };

    function chrome(active='dashboard', screen=current) {
      const unauthenticated = ['guest','auth','emailAuth','emailRecovery'].includes(screen);
      const nav = [
        ['dashboard', icons.dash, 'Панель управления'],
        ['provide', icons.provide, 'Оказать помощь'],
        ['cycles', icons.cycles, 'Мои циклы помощи'],
        ['partners', icons.partners, 'Партнерская программа'],
        ['vote', icons.vote, 'Голосование'],
        ['profile', icons.profile, 'Профиль'],
        ['knowledge', icons.knowledge, 'База знаний']
      ];
      const prototypeRoutes = {
        dashboard: userMode==='web3'?'web3':'dashboard',
        provide: 'cycle',
        cycles: 'claim',
        profile: 'security'
      };
      const walletControl = unauthenticated
        ? `<button class="chip wallet-chip" onclick="render('auth')"><div class="chip-icon">↪</div><div class="chip-copy"><small>Atlas System</small><strong>Войти</strong></div></button>`
        : userMode==='web3'
        ? `<div class="chip wallet-chip" title="Подключённый внешний Web3-кошелёк"><div class="chip-icon">◇</div><div class="chip-copy"><small>Web3 wallet</small><strong>${hasArchivedWalletHistory?'0x9B72…73D2':'0xC71D…bBE1'}</strong></div></div>`
        : !walletReady
          ? `<button class="chip wallet-chip" onclick="render('setup')"><div class="chip-icon">＋</div><div class="chip-copy"><small>Atlas Wallet</small><strong>Создать кошелёк</strong></div></button>`
          : `<button class="chip wallet-chip" onclick="openWallet()"><div class="chip-icon">▰</div><div class="chip-copy"><small>Atlas Wallet</small><strong>1 248,50 USDT</strong></div></button>`;
      return `
        <header class="topbar">
          <img class="logo" src="assets/atlas-logo.svg" alt="Atlas System" />
          <div class="top-left">
            <div class="chip days"><div class="chip-icon">◉</div><div class="chip-copy"><small>Дней в системе</small><strong>${unauthenticated?'—':'26'}</strong></div></div>
          </div>
          <div class="top-right">
            <div class="chip votes"><div class="chip-icon">📣</div><div class="chip-copy"><small>Баланс голосов</small><strong>${unauthenticated?'—':'100'}</strong></div></div>
            ${walletControl}
            <div class="chip language-chip"><span>文</span><strong>Русский⌄</strong></div>
            <button class="chip icon-chip" aria-label="Открыть меню" aria-expanded="${mobileMenuOpen}" onclick="toggleMobileMenu()">☰</button>

    function activateOverlayA11y(){
      const overlay=document.querySelector('.modal,.drawer');
      document.onkeydown=null;
      if(!overlay) return;
      document.querySelector('.topbar')?.setAttribute('inert','');
      document.querySelector('.landing-view')?.setAttribute('inert','');
      const layout=document.querySelector('.layout');
      const overlayRoot=overlay.closest('.modal-backdrop,.drawer');
      if(layout?.contains(overlay)){
        document.querySelector('.sidebar')?.setAttribute('inert','');
        document.querySelectorAll('.main > *').forEach(child=>{ if(child!==overlayRoot && !child.contains(overlay)) child.setAttribute('inert',''); });
      } else {
        layout?.setAttribute('inert','');
      }
      const focusable=()=>[...overlay.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),a[href]')].filter(x=>x.offsetParent!==null);
      setTimeout(()=>{ (overlay.querySelector('input,textarea,select') || focusable()[0])?.focus(); },0);
      document.onkeydown=(event)=>{
        if(event.key==='Escape'){ overlay.querySelector('.close')?.click(); return; }
        if(event.key!=='Tab') return;
        const items=focusable(); if(!items.length) return;
        const first=items[0],last=items[items.length-1];
        if(event.shiftKey && document.activeElement===first){ event.preventDefault(); last.focus(); }
        else if(!event.shiftKey && document.activeElement===last){ event.preventDefault(); first.focus(); }
      };
    }

    function finalizeMigration(){
      const password=document.getElementById('paymentPassword')?.value || '';

      walletReady=false;
      hasArchivedWalletHistory=true;

    function render(screen){
      if(userMode==='web3' && emailOnlyScreens.has(screen)) screen='web3';
      if(userMode==='web3' && ['dashboard','dashboardNoWallet'].includes(screen)) screen='web3';
      if(userMode==='web3' && ['history','historyDetail'].includes(screen) && !hasArchivedWalletHistory) screen='web3';
      current=screen;
      syncPrototypeControls();
      document.querySelectorAll('.screen-tab').forEach(x=>x.classList.toggle('active',x.dataset.screen===screen));
      const app=document.getElementById('app');
      const landingScreen=['landing','landingAuth'].includes(screen);
      app.classList.toggle('landing-mode',landingScreen);
      if(landingScreen){
        app.innerHTML=landingPage();
        if(screen==='landingAuth') app.insertAdjacentHTML('beforeend',landingAuthModal());
        activateOverlayA11y();
        return;
      }
      let active='dashboard';
      if(['cycle','cycleConfirm'].includes(screen) || (['pending','success'].includes(screen) && operationKind==='cycle')) active='provide';
      if(['claim','claimConfirm'].includes(screen) || (['pending','success'].includes(screen) && operationKind==='claim')) active='cycles';
      if(screen==='security') active='profile';
      app.innerHTML=chrome(active, screen);
      const main=document.getElementById('mainContent');
      if(screen==='web3' || screen==='web3Migrated') main.innerHTML=web3Dashboard();
      else if(screen==='guest') main.innerHTML=guestDashboard();
      else if(['auth','emailAuth','emailRecovery'].includes(screen)) {
        main.innerHTML=guestDashboard();
        document.getElementById('app').insertAdjacentHTML('beforeend',screen==='auth'?authModal():screen==='emailAuth'?emailAuthModal():emailRecoveryModal());
      }
      else if(screen==='dashboard' || screen==='dashboardNoWallet') main.innerHTML=walletReady?dashboard():dashboardNoWallet();
      else if(screen==='cycle') main.innerHTML=cyclePage(false);
      else if(screen==='cycleConfirm') main.innerHTML=cyclePage(true);
      else if(screen==='claim') main.innerHTML=claimPage(false);
      else if(screen==='claimConfirm') main.innerHTML=claimPage(true);
      else if(screen==='history') main.innerHTML=historyPage();
      else if(screen==='historyDetail') { main.innerHTML=historyPage(); document.getElementById('app').insertAdjacentHTML('beforeend',historyDetailModal()); }
      else if(screen==='ticket') { main.innerHTML=historyPage(); document.getElementById('app').insertAdjacentHTML('beforeend',ticketModal()); }
      else if(screen==='ticketCreated') { main.innerHTML=historyPage(); document.getElementById('app').insertAdjacentHTML('beforeend',ticketCreatedModal()); }
      else if(screen==='security') main.innerHTML=securityPage();
      else if(screen==='migrate') main.innerHTML=migrationPage();
      else if(screen==='migrationTransfer') { main.innerHTML=migrationPage(); document.getElementById('app').insertAdjacentHTML('beforeend',migrationTransferModal()); }
      else if(screen==='migrationFinal') { main.innerHTML=migrationPage(); document.getElementById('app').insertAdjacentHTML('beforeend',migrationFinalModal()); }
      else if(screen==='swap') main.innerHTML=swapPage();
      else if(screen==='states') main.innerHTML=statesPage();
      else if(screen==='flows') { main.innerHTML=flowsPage(); revealActiveFlow(); }
      else if(screen==='pending' || screen==='success') {
        main.innerHTML=operationKind==='cycle'?cyclePage(false):operationKind==='claim'?claimPage(false):dashboard();
        document.getElementById('app').insertAdjacentHTML('beforeend',screen==='pending'?pendingModal():successModal());
      }
      else {
        main.innerHTML=dashboard();
        if(screen==='wallet') document.getElementById('app').insertAdjacentHTML('beforeend',walletDrawer());
        if(screen==='setup') document.getElementById('app').insertAdjacentHTML('beforeend',setupModal());
        if(screen==='walletCreated') document.getElementById('app').insertAdjacentHTML('beforeend',walletCreatedModal());
        if(screen==='deposit') document.getElementById('app').insertAdjacentHTML('beforeend',depositModal());
        if(screen==='depositCrypto') document.getElementById('app').insertAdjacentHTML('beforeend',depositCryptoModal());
        if(screen==='depositProvider') document.getElementById('app').insertAdjacentHTML('beforeend',depositProviderModal());
        if(screen==='depositProviderWait') document.getElementById('app').insertAdjacentHTML('beforeend',depositProviderWaitModal());
        if(screen==='depositCard') document.getElementById('app').insertAdjacentHTML('beforeend',depositCardModal());
        if(screen==='depositCardWait') document.getElementById('app').insertAdjacentHTML('beforeend',depositCardWaitModal());
        if(screen==='depositWait') document.getElementById('app').insertAdjacentHTML('beforeend',depositWaitModal());
        if(screen==='send') document.getElementById('app').insertAdjacentHTML('beforeend',sendModal());
        if(screen==='sendReview') document.getElementById('app').insertAdjacentHTML('beforeend',sendReviewModal());
        if(screen==='withdraw') document.getElementById('app').insertAdjacentHTML('beforeend',withdrawModal(false));
        if(screen==='withdrawReview') document.getElementById('app').insertAdjacentHTML('beforeend',withdrawModal(true));
        if(screen==='success') document.getElementById('app').insertAdjacentHTML('beforeend',successModal());
      }
      activateOverlayA11y();
    }

    syncPrototypeControls();
    render('flows');
  </script>
