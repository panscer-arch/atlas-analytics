name: Sync Atlas Support email credential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          SUPPORT_KEY: ${{ secrets.ATLAS_SUPPORT_VPS_SSH_KEY }}
          SUPPORT_HOST: ${{ secrets.ATLAS_SUPPORT_VPS_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SUPPORT_KEY" > ~/.ssh/atlas_support
          chmod 600 ~/.ssh/atlas_support
          ssh-keyscan -T 15 -H "$SUPPORT_HOST" >> ~/.ssh/known_hosts

      - name: Transfer protected mail configuration
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPPORT_HOST: ${{ secrets.ATLAS_SUPPORT_VPS_HOST }}
          SUPPORT_USER: ${{ secrets.ATLAS_SUPPORT_VPS_USER }}
        run: |
          umask 077
          {
            printf 'SUPPORT_EMAIL_REQUIRED=true\n'
            printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
            printf 'SUPPORT_EMAIL_FROM=%s\n' '"Atlas Support <partners@atlas-system.io>"'
            printf 'SUPPORT_EMAIL_REPLY_TO=%s\n' 'partners@atlas-system.io'
            printf 'MAILER_SENDER_EMAIL=%s\n' '"Atlas Support <partners@atlas-system.io>"'
          } > /tmp/atlas-support-email.env
          cat > /tmp/merge-atlas-support-email.py <<'PY'
          from pathlib import Path

          target = Path("/opt/atlas-support/infra/.env")
          incoming = Path("/tmp/atlas-support-email.env")
          managed = {
              "SUPPORT_EMAIL_REQUIRED",
              "RESEND_API_KEY",
              "SUPPORT_EMAIL_FROM",
              "SUPPORT_EMAIL_REPLY_TO",
              "MAILER_SENDER_EMAIL",
          }
          current = target.read_text().splitlines()
          kept = [
              line for line in current
              if line.split("=", 1)[0] not in managed
          ]
          target.write_text("\n".join(kept + incoming.read_text().splitlines()) + "\n")
          target.chmod(0o600)
          incoming.unlink()
          PY
          scp -q -i ~/.ssh/atlas_support \
            /tmp/atlas-support-email.env /tmp/merge-atlas-support-email.py \
            "$SUPPORT_USER@$SUPPORT_HOST:/tmp/"
          ssh -i ~/.ssh/atlas_support "$SUPPORT_USER@$SUPPORT_HOST" \
            'python3 /tmp/merge-atlas-support-email.py && rm -f /tmp/merge-atlas-support-email.py'
          rm -f /tmp/atlas-support-email.env /tmp/merge-atlas-support-email.py
