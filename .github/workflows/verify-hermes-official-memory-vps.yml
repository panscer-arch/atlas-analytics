name: Verify Hermes Official Memory on VPS

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat <<'EOF' > ~/.ssh/deploy_key
          ${{ secrets.VPS_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 15 -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Verify catalog, sync and recall
        shell: bash
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=25 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          CATALOG=/opt/atlas-content-api/atlas-official-memory/catalog.json
          CURSOR=/var/lib/atlas-analytics-content/official-memory-sync/cursors.json

          sudo test -s "$CATALOG"
          sudo systemctl is-enabled atlas-official-memory-sync.timer
          sudo python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path
          from urllib.parse import urlparse

          def contains_access_token(value):
              if isinstance(value, dict):
                  return any(
                      (str(key).lower() in {'access_token', 'access-token'} and bool(item))
                      or contains_access_token(item)
                      for key, item in value.items()
                  )
              if isinstance(value, list):
                  return any(contains_access_token(item) for item in value)
              return False

          for filename in (
              '/opt/hermes/auth.json',
              '/opt/hermes/.hermes/auth.json',
              '/opt/hermes/.hermes/shared/nous_auth.json',
          ):
              path = Path(filename)
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
                  print(json.dumps({
                      'path': filename,
                      'exists': True,
                      'isSymlink': path.is_symlink(),
                      'topLevelKeys': sorted(data.keys()),
                      'providers': sorted((data.get('providers') or {}).keys()),
                      'hasAccessToken': contains_access_token(data),
                  }))
              except Exception as error:
                  print(json.dumps({'path': filename, 'exists': path.exists(), 'errorType': type(error).__name__}))

          for filename in (
              '/opt/hermes/.env',
              '/opt/hermes/.hindsight/profiles/hermes.env',
          ):
              path = Path(filename)
              values = {}
              try:
                  for raw in path.read_text(encoding='utf-8').splitlines():
                      if '=' not in raw or raw.lstrip().startswith('#'):
                          continue
                      key, value = raw.split('=', 1)
                      if key in {
                          'OPENAI_API_KEY', 'OPENROUTER_API_KEY', 'HINDSIGHT_LLM_API_KEY',
                          'HINDSIGHT_API_LLM_API_KEY', 'GOOGLE_API_KEY', 'GEMINI_API_KEY',
                      }:
                          values[key] = bool(value.strip())
                  print(json.dumps({'path': filename, 'configuredKeys': values}))
              except Exception as error:
                  print(json.dumps({'path': filename, 'exists': path.exists(), 'errorType': type(error).__name__}))

          config_path = Path('/opt/hermes/hindsight/config.json')
          try:
              config = json.loads(config_path.read_text(encoding='utf-8'))
              print(json.dumps({
                  'path': str(config_path),
                  'mode': config.get('mode'),
                  'llmProvider': config.get('llm_provider'),
                  'llmModel': config.get('llm_model'),
                  'llmHost': urlparse(str(config.get('llm_base_url') or '')).hostname,
              }))
          except Exception as error:
              print(json.dumps({'path': str(config_path), 'exists': config_path.exists(), 'errorType': type(error).__name__}))

          env_values = {}
          for raw in Path('/opt/hermes/.env').read_text(encoding='utf-8').splitlines():
              if '=' in raw and not raw.lstrip().startswith('#'):
                  key, value = raw.split('=', 1)
                  env_values[key] = value.strip()
          candidates = {
              'OPENAI_API_KEY': env_values.get('OPENAI_API_KEY'),
              'HINDSIGHT_LLM_API_KEY': env_values.get('HINDSIGHT_LLM_API_KEY'),
          }
          for name, token in candidates.items():
              if not token:
                  continue
              for host, endpoint in (
                  ('openai', 'https://api.openai.com/v1/models'),
                  ('nous', 'https://inference-api.nousresearch.com/v1/models'),
              ):
                  request = urllib.request.Request(endpoint, headers={'Authorization': f'Bearer {token}'})
                  try:
                      with urllib.request.urlopen(request, timeout=20) as response:
                          status = response.status
                  except urllib.error.HTTPError as error:
                      status = error.code
                  except Exception as error:
                      status = type(error).__name__
                  print(json.dumps({'credential': name, 'endpoint': host, 'status': status}))
          PY

          ready="$(sudo sed -n 's/^HERMES_LONG_TERM_MEMORY_READY=//p' /etc/atlas-telegram-bot.env | tail -n 1)"
          if ! printf '%s' "$ready" | grep -Eiq '^(1|true|yes|on)$'; then
            sudo -u hermes env HOME=/opt/hermes HERMES_HOME=/opt/hermes \
              /opt/hermes/configure-hermes-hindsight.sh
            sudo python3 - <<'PY'
          from pathlib import Path

          path = Path('/etc/atlas-telegram-bot.env')
          lines = path.read_text(encoding='utf-8').splitlines()
          key = 'HERMES_LONG_TERM_MEMORY_READY'
          updated = []
          found = False
          for line in lines:
              if line.startswith(f'{key}='):
                  updated.append(f'{key}=1')
                  found = True
              else:
                  updated.append(line)
          if not found:
              updated.append(f'{key}=1')
          temporary = path.with_suffix('.tmp')
          temporary.write_text('\n'.join(updated) + '\n', encoding='utf-8')
          temporary.chmod(0o600)
          temporary.replace(path)
          PY
            sudo systemctl restart hermes-telegram-bridge.service
          fi

          sudo systemctl start --no-block atlas-official-memory-sync.service

          for attempt in $(seq 1 240); do
            state="$(sudo systemctl is-active atlas-official-memory-sync.service || true)"
            if [ "$state" != "activating" ]; then
              break
            fi
            sleep 10
          done

          state="$(sudo systemctl is-active atlas-official-memory-sync.service || true)"
          if [ "$state" = "activating" ] || [ "$state" = "failed" ]; then
            sudo systemctl status atlas-official-memory-sync.service --no-pager || true
            sudo journalctl -u atlas-official-memory-sync.service -n 120 --no-pager || true
            exit 1
          fi

          if ! sudo test -s "$CURSOR"; then
            sudo systemctl status atlas-hermes-hindsight-nous.service --no-pager || true
            sudo journalctl -u atlas-hermes-hindsight-nous.service -n 120 --no-pager || true
            sudo systemctl status atlas-official-memory-sync.service --no-pager || true
            sudo journalctl -u atlas-official-memory-sync.service -n 120 --no-pager || true
            exit 1
          fi

          sudo node - "$CATALOG" "$CURSOR" <<'NODE'
          const fs = require('node:fs');
          const catalog = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const cursor = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const sourceCount = catalog.sources?.length || 0;
          const cursorCount = Object.keys(cursor.sources || {}).length;
          if (cursorCount < sourceCount) throw new Error(`Only ${cursorCount}/${sourceCount} source chunks were synced`);
          console.log(JSON.stringify({ catalog: catalog.stats, sourceCount, cursorCount, syncedAt: cursor.updatedAt }, null, 2));
          NODE

          sudo python3 - <<'PY'
          import json
          import urllib.request

          env = {}
          with open('/etc/atlas-telegram-bot.env', encoding='utf-8') as handle:
              for raw in handle:
                  line = raw.strip()
                  if not line or line.startswith('#') or '=' not in line:
                      continue
                  key, value = line.split('=', 1)
                  env[key] = value.strip().strip('"').strip("'")
          token = env.get('HERMES_TELEGRAM_BRIDGE_TOKEN') or env.get('HERMES_BRIDGE_TOKEN')
          if not token:
              raise SystemExit('Hermes bridge token is not configured')
          payload = json.dumps({
              'prompt': 'Проверка официальной памяти. Назови текущий адрес Daily Flow V2, пометь Daily Flow V1 как legacy и скажи, запущены или планируются Linear, Binary и Smart Matrix 1. Ответь кратко.',
              'memoryScope': 'global',
              'source': {'chatId': 'official-memory-verification', 'chatTitle': 'Official memory verification', 'authorName': 'Deployment verifier'},
          }, ensure_ascii=False).encode('utf-8')
          request = urllib.request.Request(
              'http://127.0.0.1:9120/message',
              data=payload,
              headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=190) as response:
              answer = json.load(response).get('answer', '')
          lowered = answer.lower()
          assert '0x8e61483d45a822ccb59482c47e1b6d28465605ec' in lowered, answer
          assert '0x8f418e29a32aab69abf3da742c43e7adfbfa3c3' in lowered, answer
          assert 'legacy' in lowered or 'устар' in lowered, answer
          assert 'план' in lowered or 'planned' in lowered, answer
          print(answer)
          PY
          REMOTE
