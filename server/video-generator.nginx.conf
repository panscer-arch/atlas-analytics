location = /video-generator-health {
    proxy_pass http://127.0.0.1:8501/video-generator/_stcore/health;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    add_header Cache-Control "no-store" always;
}

location = /video-generator-login {
    proxy_pass http://127.0.0.1:8511/login$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 16k;
}

location = /video-generator-logout {
    proxy_pass http://127.0.0.1:8511/logout;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /_video-generator-auth {
    internal;
    proxy_pass http://127.0.0.1:8511/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
}

location @video-generator-login-redirect {
    return 302 /video-generator-login?next=$request_uri;
}

location = /video-generator {
    return 301 /video-generator/;
}

location ^~ /video-generator/ {
    auth_request /_video-generator-auth;
    error_page 401 = @video-generator-login-redirect;

    proxy_pass http://127.0.0.1:8501;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
    client_max_body_size 200m;
}
