services:
  api:
    environment:
      ATLAS_ADMIN_FINANCE_FORECAST_ENABLED: "true"
      ATLAS_ADMIN_FINANCE_DATABASE_URL: ${ATLAS_ADMIN_FINANCE_DATABASE_URL:?required}
      ATLAS_ADMIN_FINANCE_DATABASE_CA_FILE: /run/secrets/admin-finance-postgres-ca.pem
      ATLAS_ADMIN_FINANCE_FORECAST_URL: ${ATLAS_ADMIN_FINANCE_FORECAST_URL:?required}
      ATLAS_ADMIN_FINANCE_FORECAST_AUTHORIZATION: ${ATLAS_ADMIN_FINANCE_FORECAST_AUTHORIZATION:?required}
      ATLAS_ADMIN_FINANCE_PAYOUT_CONTRACT: ${ATLAS_ADMIN_FINANCE_PAYOUT_CONTRACT:?required}
      ATLAS_ADMIN_FINANCE_FORECAST_MIN_CONFIRMATIONS: ${ATLAS_ADMIN_FINANCE_FORECAST_MIN_CONFIRMATIONS:-12}
    volumes:
      - ${ATLAS_ADMIN_FINANCE_DATABASE_CA_HOST_FILE:?required}:/run/secrets/admin-finance-postgres-ca.pem:ro
